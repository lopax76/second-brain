<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Brain</title>
<!--
  Interactive graph viewer adapted from Graphify (https://github.com/safishamsi/graphify),
  MIT License, Copyright (c) 2026 Safi Shamsi. Rendering library: vis-network (Apache-2.0 OR MIT).
  Both are bundled offline; see THIRD_PARTY_NOTICES.md. Thanks to the Graphify project.
-->
<script src="vis-bundle.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f1a; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; height: 100vh; overflow: hidden; }
  #graph { flex: 1; }
  #sidebar { width: 300px; background: #1a1a2e; border-left: 1px solid #2a2a4e; display: flex; flex-direction: column; overflow: hidden; }
  #title-wrap { padding: 12px 12px 0; }
  #title-wrap .title { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #search-wrap { padding: 12px; border-bottom: 1px solid #2a2a4e; }
  #search { width: 100%; background: #0f0f1a; border: 1px solid #3a3a5e; color: #e0e0e0; padding: 7px 10px; border-radius: 6px; font-size: 13px; outline: none; }
  #search:focus { border-color: #4E79A7; }
  #search-results { max-height: 140px; overflow-y: auto; padding: 4px 12px; border-bottom: 1px solid #2a2a4e; display: none; }
  .search-item { padding: 4px 6px; cursor: pointer; border-radius: 4px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search-item:hover { background: #2a2a4e; }
  #info-panel { padding: 14px; border-bottom: 1px solid #2a2a4e; min-height: 140px; }
  #info-panel h3 { font-size: 13px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  #info-content { font-size: 13px; color: #ccc; line-height: 1.6; }
  #info-content .field { margin-bottom: 5px; }
  #info-content .field b { color: #e0e0e0; }
  #info-content .empty { color: #555; font-style: italic; }
  .neighbor-link { display: block; padding: 2px 6px; margin: 2px 0; border-radius: 3px; cursor: pointer; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid #333; }
  .neighbor-link:hover { background: #2a2a4e; }
  #neighbors-list { max-height: 200px; overflow-y: auto; margin-top: 4px; }
  #legend-wrap { flex: 1; overflow-y: auto; padding: 12px; }
  #legend-wrap h3 { font-size: 13px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; border-radius: 4px; font-size: 12px; }
  .legend-item:hover { background: #2a2a4e; padding-left: 4px; }
  .legend-item.dimmed { opacity: 0.35; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .legend-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-count { color: #666; font-size: 11px; }
  #stats { padding: 10px 14px; border-top: 1px solid #2a2a4e; font-size: 11px; color: #555; }
  #legend-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 4px 0; }
  #legend-controls label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: #aaa; user-select: none; }
  #legend-controls label:hover { color: #e0e0e0; }
  .legend-cb, #select-all-cb { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; border: 1.5px solid #3a3a5e; border-radius: 3px; background: #0f0f1a; cursor: pointer; position: relative; flex-shrink: 0; }
  .legend-cb:checked, #select-all-cb:checked { background: #4E79A7; border-color: #4E79A7; }
  .legend-cb:checked::after, #select-all-cb:checked::after { content: ''; position: absolute; left: 3.5px; top: 1px; width: 4px; height: 7px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  #select-all-cb:indeterminate { background: #4E79A7; border-color: #4E79A7; }
  #select-all-cb:indeterminate::after { content: ''; position: absolute; left: 2px; top: 5px; width: 8px; height: 2px; background: #fff; border: none; transform: none; }
  #error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 40px; background: #0f0f1a; }
  #error div { max-width: 520px; color: #cbd5e1; font-size: 15px; line-height: 1.6; }
</style>
</head>
<body>
<div id="graph"></div>
<div id="sidebar">
  <div id="title-wrap"><div class="title" id="title"></div></div>
  <div id="search-wrap">
    <input id="search" type="text" placeholder="Search nodes..." autocomplete="off">
    <div id="search-results"></div>
  </div>
  <div id="info-panel">
    <h3>Node Info</h3>
    <div id="info-content"><span class="empty">Click a node to inspect it</span></div>
  </div>
  <div id="legend-wrap">
    <h3>Communities</h3>
    <div id="legend-controls">
      <label><input type="checkbox" id="select-all-cb" checked onchange="toggleAllCommunities(!this.checked)">Select All</label>
    </div>
    <div id="legend"></div>
  </div>
  <div id="stats"></div>
</div>
<div id="error"><div><b>Graph library could not be loaded.</b><br>
  The viewer bundles its rendering library inline and works fully offline. If you see this,
  the page may be corrupted; re-run <code>second-brain view</code> to regenerate it.</div></div>

<script type="application/json" id="sb-data">__SB_DATA__</script>
<script>
(function () {
  var SB;
  try { SB = JSON.parse(document.getElementById('sb-data').textContent); }
  catch (err) { var e = document.getElementById('error'); e.style.display = 'flex'; e.textContent = 'Graph data is corrupted: ' + err.message; return; }
  if (typeof vis === 'undefined' || !vis.Network) { document.getElementById('error').style.display = 'flex'; return; }

  var RAW_NODES = SB.nodes, RAW_EDGES = SB.edges, LEGEND = SB.legend;
  document.getElementById('title').textContent = SB.project || 'Second Brain';
  document.getElementById('stats').textContent =
    SB.stats.nodes + ' nodes · ' + SB.stats.edges + ' edges · ' + SB.stats.communities + ' communities';

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  var nodesDS = new vis.DataSet(RAW_NODES.map(function (n) {
    return { id: n.id, label: n.label, color: n.color, size: n.size, font: n.font, title: n.title,
      community: n.community, _community_name: n.community_name, _source_file: n.source_file,
      _file_type: n.file_type, _degree: n.degree };
  }));
  var edgesDS = new vis.DataSet(RAW_EDGES.map(function (e, i) {
    return { id: i, from: e.from, to: e.to, title: e.title, dashes: e.dashes, width: e.width,
      color: e.color, arrows: { to: { enabled: true, scaleFactor: 0.5 } } };
  }));

  var container = document.getElementById('graph');
  var network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
    physics: {
      enabled: true,
      solver: 'forceAtlas2Based',
      forceAtlas2Based: { gravitationalConstant: -60, centralGravity: 0.005, springLength: 120,
        springConstant: 0.08, damping: 0.4, avoidOverlap: 0.8 },
      stabilization: { iterations: 200, fit: true },
    },
    interaction: { hover: true, tooltipDelay: 100, hideEdgesOnDrag: true, navigationButtons: false, keyboard: false },
    nodes: { shape: 'dot', borderWidth: 1.5 },
    edges: { smooth: { type: 'continuous', roundness: 0.2 }, selectionWidth: 3 },
  });
  window.network = network;

  network.once('stabilizationIterationsDone', function () {
    network.setOptions({ physics: { enabled: false } });
  });

  function showInfo(nodeId) {
    var n = nodesDS.get(nodeId);
    if (!n) return;
    var neighborIds = network.getConnectedNodes(nodeId);
    var neighborItems = neighborIds.map(function (nid) {
      var nb = nodesDS.get(nid);
      var color = nb ? nb.color.background : '#555';
      return '<span class="neighbor-link" style="border-left-color:' + esc(color) + '" onclick="focusNode(' + JSON.stringify(nid) + ')">' + esc(nb ? nb.label : nid) + '</span>';
    }).join('');
    document.getElementById('info-content').innerHTML =
      '<div class="field"><b>' + esc(n.label) + '</b></div>' +
      '<div class="field">Type: ' + esc(n._file_type || 'unknown') + '</div>' +
      '<div class="field">Community: ' + esc(n._community_name) + '</div>' +
      '<div class="field">Source: ' + esc(n._source_file || '-') + '</div>' +
      '<div class="field">Degree: ' + n._degree + '</div>' +
      (neighborIds.length ? '<div class="field" style="margin-top:8px;color:#aaa;font-size:11px">Neighbors (' + neighborIds.length + ')</div><div id="neighbors-list">' + neighborItems + '</div>' : '');
  }
  window.showInfo = showInfo;

  function focusNode(nodeId) {
    network.focus(nodeId, { scale: 1.4, animation: true });
    network.selectNodes([nodeId]);
    showInfo(nodeId);
  }
  window.focusNode = focusNode;

  var hoveredNodeId = null;
  network.on('hoverNode', function (params) { hoveredNodeId = params.node; container.style.cursor = 'pointer'; });
  network.on('blurNode', function () { hoveredNodeId = null; container.style.cursor = 'default'; });
  container.addEventListener('click', function () {
    if (hoveredNodeId !== null) { showInfo(hoveredNodeId); network.selectNodes([hoveredNodeId]); }
  });
  network.on('click', function (params) {
    if (params.nodes.length > 0) showInfo(params.nodes[0]);
    else if (hoveredNodeId === null) document.getElementById('info-content').innerHTML = '<span class="empty">Click a node to inspect it</span>';
  });

  var searchInput = document.getElementById('search');
  var searchResults = document.getElementById('search-results');
  searchInput.addEventListener('input', function () {
    var q = searchInput.value.toLowerCase().trim();
    searchResults.innerHTML = '';
    if (!q) { searchResults.style.display = 'none'; return; }
    var matches = RAW_NODES.filter(function (n) { return n.label.toLowerCase().indexOf(q) !== -1; }).slice(0, 20);
    if (!matches.length) { searchResults.style.display = 'none'; return; }
    searchResults.style.display = 'block';
    matches.forEach(function (n) {
      var el = document.createElement('div');
      el.className = 'search-item';
      el.textContent = n.label;
      el.style.borderLeft = '3px solid ' + n.color.background;
      el.style.paddingLeft = '8px';
      el.onclick = function () {
        network.focus(n.id, { scale: 1.5, animation: true });
        network.selectNodes([n.id]); showInfo(n.id);
        searchResults.style.display = 'none'; searchInput.value = '';
      };
      searchResults.appendChild(el);
    });
  });
  document.addEventListener('click', function (e) {
    if (!searchResults.contains(e.target) && e.target !== searchInput) searchResults.style.display = 'none';
  });

  var hiddenCommunities = new Set();
  var selectAllCb = document.getElementById('select-all-cb');
  function updateSelectAllState() {
    var total = LEGEND.length, hidden = hiddenCommunities.size;
    selectAllCb.checked = hidden === 0;
    selectAllCb.indeterminate = hidden > 0 && hidden < total;
  }
  function toggleAllCommunities(hide) {
    document.querySelectorAll('.legend-item').forEach(function (item) {
      hide ? item.classList.add('dimmed') : item.classList.remove('dimmed');
    });
    document.querySelectorAll('.legend-cb').forEach(function (cb) { cb.checked = !hide; });
    LEGEND.forEach(function (c) { if (hide) hiddenCommunities.add(c.cid); else hiddenCommunities.delete(c.cid); });
    nodesDS.update(RAW_NODES.map(function (n) { return { id: n.id, hidden: hide }; }));
    updateSelectAllState();
  }
  window.toggleAllCommunities = toggleAllCommunities;

  var legendEl = document.getElementById('legend');
  LEGEND.forEach(function (c) {
    var item = document.createElement('div');
    item.className = 'legend-item';
    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.className = 'legend-cb'; cb.checked = true;
    cb.addEventListener('change', function (e) {
      e.stopPropagation();
      if (cb.checked) { hiddenCommunities.delete(c.cid); item.classList.remove('dimmed'); }
      else { hiddenCommunities.add(c.cid); item.classList.add('dimmed'); }
      nodesDS.update(RAW_NODES.filter(function (n) { return n.community === c.cid; })
        .map(function (n) { return { id: n.id, hidden: !cb.checked }; }));
      updateSelectAllState();
    });
    item.innerHTML = '<div class="legend-dot" style="background:' + esc(c.color) + '"></div>' +
      '<span class="legend-label">' + esc(c.label) + '</span>' +
      '<span class="legend-count">' + c.count + '</span>';
    item.prepend(cb);
    item.onclick = function (e) { if (e.target === cb) return; cb.checked = !cb.checked; cb.dispatchEvent(new Event('change')); };
    legendEl.appendChild(item);
  });
})();
</script>
</body>
</html>
