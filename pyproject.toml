[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain"
dynamic = ["version"]
description = "A living, always-fresh, low-token map of every project: files, links, areas and mechanics, with a navigable 3D view."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lopax", email = "lopax76@users.noreply.github.com" }]
keywords = ["knowledge-graph", "memory", "ai-agents", "documentation", "code-graph", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
mcp = ["mcp>=1.2"]

[project.scripts]
second-brain = "second_brain.cli:main"
second-brain-mcp = "second_brain.mcp_server:main"

[project.urls]
Homepage = "https://github.com/lopax76/second-brain"
Repository = "https://github.com/lopax76/second-brain"
Issues = "https://github.com/lopax76/second-brain/issues"
Documentation = "https://github.com/lopax76/second-brain#readme"

[tool.setuptools]
packages = ["second_brain"]

[tool.setuptools.dynamic]
version = { attr = "second_brain.__version__" }

[tool.setuptools.package-data]
second_brain = ["ui/*.html", "ui/*.js", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
